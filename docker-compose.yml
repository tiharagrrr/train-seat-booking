services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railway}
      POSTGRES_USER: ${POSTGRES_USER:-railway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railway-local-only}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-railway}:${POSTGRES_PASSWORD:-railway-local-only}@db:5432/${POSTGRES_DB:-railway}
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:5173
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:4000
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  postgres_data:
